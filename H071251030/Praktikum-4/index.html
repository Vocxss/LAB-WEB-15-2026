<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entah apa namanya</title>
    <script>
      let namePerson = prompt("Masukkan nama anda", "Tsaqif");

      const dataPraktikan = [
        { nama: "Budi", nilaiTugas: [80, 85, 90] },
        { nama: "Siti", nilaiTugas: [60, 60, 60] },
        { nama: "Andi", nilaiTugas: [90, 90, 90] },
        { nama: "Dewi", nilaiTugas: [75, 75, 75] },
        { nama: "Eko", nilaiTugas: [45, 45, 45] },
      ];

      let hasil = [];

      dataPraktikan.forEach((item) => {
        totalNilai = item.nilaiTugas.reduce((a, b) => a + b);
        average = totalNilai / item.nilaiTugas.length;
        let statusAkhir = "";
        if (average < 75) statusAkhir = "Tidak lulus";
        else statusAkhir = "Lulus";
        hasil.push({
          nama: item.nama,
          rerata: average,
          status: statusAkhir,
        });
      });

      console.log(hasil);

      // document.open();

      document.write(
        `<h1 class="mt-12 font-sans font-bold text-blue-600 text-2xl">Laporan Praktikum</h1>`,
      );

      if (namePerson.length === 0) {
        document.write(
          `<p class="font-sans text-red-600 font-bold">Akses ditolak</p>`,
        );
      } else {
        document.write(
          `<p class="font-bold text-blue-600 mb-8">Hola! ${namePerson}</p>`,
        );

        hasil.forEach((item) => {
          document.write(
            `<div class="card"><div class="kiri"><p class="nama">${item.nama}</p><p class="rata">Rata-rata nilai: ${item.rerata}</p></div><div class="kanan">${item.status == "Lulus" ? "<p class='lulus'>" : "<p class='tidaklulus'>"}${item.status}</p></div></div>`,
          );
        });
      }
    </script>
    <style>
      * {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: rgb(214, 214, 214);
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 4px;
        justify-content: center;
        align-items: center;
      }

      h1 {
        color: blue;
        font-size: 500;
        font-weight: 800;
      }

      .card {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 8px;
        width: 480px;
        padding: 16px;
        background-color: rgba(223, 223, 255, 0.571);
        margin: 8px;
        border-radius: 8px;
      }

      .kanan {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .nama {
        font-size: 16px;
        font-weight: bold;
      }

      .lulus {
        padding: 2px 4px;
        border-radius: 2px;
        color: lime;
      }

      .tidaklulus {
        padding: 2px 4px;
        border-radius: 2px;
        color: red;
      }
    </style>
  </head>
  <body class="bg-background min-h-dvh flex justify-center items-center"></body>
</html>
